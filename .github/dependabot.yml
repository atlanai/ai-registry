# GitHub Actions are updated by Renovate (renovate.json), which keeps them pinned to digests.
version: 2
updates:
  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: weekly
    # Match pnpm's minimum release age for routine version updates.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # One pull request for minor and patch updates; each major version gets its own.
    groups:
      cli:
        patterns: ["*"]
        update-types: [minor, patch]

  # The hash-locked docs and schema-check toolchains.
  - package-ecosystem: pip
    directories: [/docs, /tools]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
