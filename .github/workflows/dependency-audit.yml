name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  audit:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cli/.node-version
          package-manager-cache: false
      - run: npm install --global --force corepack@0.36.0 && corepack enable pnpm
      # Audit the committed lockfile without installing packages. Cooldown and
      # provenance checks remain enforced by the CLI validation installs.
      # Development tools parse repository input too, so audit all dependencies.
      - run: pnpm audit --audit-level=moderate

  python-audit:
    name: Python vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - run: python3 -m pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --no-deps -r ../docs/requirements.txt -r ../tools/requirements.txt
