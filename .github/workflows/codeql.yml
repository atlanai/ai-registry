name: CodeQL

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: ${{ matrix.name }}
    # Public repositories can use CodeQL without a private-repository license.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: JavaScript and TypeScript, language: javascript-typescript}
          # Expression injection and untrusted checkouts in the workflows themselves.
          - {name: GitHub Actions workflows, language: actions}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
