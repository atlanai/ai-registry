# Builds the documentation site with MkDocs and publishes it to GitHub Pages.
# Pages must be enabled for this repository with "GitHub Actions" as the source.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "spec/**"
      - "examples/**"
      - "mkdocs.yml"
      - "tools/build_figures.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Documentation site build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install the pinned documentation build
        run: python3 -m pip install --require-hashes -r docs/requirements.txt
      - name: Check the figures are current
        run: python3 tools/build_figures.py --check
      - name: Build
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Documentation site deploy
    if: github.repository == 'atlanai/ai-registry' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
