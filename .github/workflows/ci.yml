name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Stacked PRs target another PR branch before they are retargeted to main.
  pull_request:

permissions:
  contents: read

# Only pull requests cancel: a release needs a finished run on its main commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: cli

jobs:
  changes:
    name: CI change detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    outputs:
      cli: ${{ steps.paths.outputs.cli }}
      spec: ${{ steps.paths.outputs.spec }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select required validation
        id: paths
        shell: python
        run: |
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          # Pushes validate everything. PRs use the complete diff, without the
          # API's file-count limit. Unknown paths and workflow changes run all checks.
          required = dict(cli=True, spec=True, docs=True)
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              base = event["pull_request"]["base"]["sha"]
              head = event["pull_request"]["head"]["sha"]
              assert all(re.fullmatch(r"[0-9a-f]{40,64}", sha) for sha in (base, head))
              changed = subprocess.check_output([
                  "git", "diff", "--no-renames", "--name-only", "-z", f"{base}...{head}", "--",
              ]).decode().split("\0")[:-1]
              selected = dict(cli=False, spec=False, docs=False)
              for path in changed:
                  if path.startswith(("spec/", "examples/")):
                      selected = dict(cli=True, spec=True, docs=True)
                  elif path.startswith("cli/"):
                      selected["cli"] = True
                      # The install pins in the docs follow the CLI's version.
                      if path == "cli/package.json":
                          selected["docs"] = True
                  elif path in ("tools/check.py", "tools/check_schemas.py", "tools/requirements.txt", "tools/test_check.py"):
                      selected["spec"] = True
                  elif (path.startswith("docs/")
                        or path in ("mkdocs.yml", "tools/build_figures.py", "tools/check_pins.py")
                        or ("/" not in path and path.endswith(".md"))):
                      selected["docs"] = True
                  else:
                      selected = dict(cli=True, spec=True, docs=True)
              if changed:
                  required = selected
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, needed in required.items():
                  output.write(f"{name}={str(needed).lower()}\n")

  check:
    name: CLI quality and coverage
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # registry validate compares released versions with the target branch.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: cli/.node-version
          # Would shell out to pnpm before corepack has put it on PATH.
          package-manager-cache: false

      # Corepack downloads pnpm on every run otherwise; the pin it is keyed on carries pnpm's hash.
      - id: corepack
        shell: bash
        run: |
          echo "COREPACK_HOME=$RUNNER_TEMP/corepack" >> "$GITHUB_ENV"
          echo "pin=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corepack
          key: corepack-${{ runner.os }}-${{ steps.corepack.outputs.pin }}

      # Verifies pnpm against the integrity hash in packageManager.
      # Hosted Windows runners preinstall Yarn shims; replace them with Corepack.
      - run: npm install --global --force corepack@0.36.0 && corepack enable pnpm

      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('cli/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint:ci
      # Files a pull request touches must be free of warnings too.
      - if: github.event_name == 'pull_request'
        run: pnpm run lint:changed --since="$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: pnpm run knip
      # Fails on a stale THIRD_PARTY_NOTICES.txt or a license outside the allowlist.
      - run: pnpm run notices --check
      # The e2e suites spawn the built CLI.
      - run: pnpm run build
      - run: node dist/main.mjs registry validate ../examples/acme-registry
      - run: node dist/main.mjs registry validate ../examples/aireg
      - run: pnpm run check:package

      - name: Test with coverage
        run: pnpm run test:coverage
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com

  audit:
    name: Dependency audit
    uses: ./.github/workflows/dependency-audit.yml

  codeql:
    name: CodeQL
    if: github.event.repository.private == false
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  # A gate per suite keeps its required check name over the shards, and passes when path selection skips it.
  compat-node-min-shard:
    name: CLI tests (Node 22.20.0, ubuntu-latest, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      # Runtime values use patched floors.
      CI_NODE_VERSION: "22.23.4"
    steps: &compat-steps
      # Git for Windows checks out CRLF by default, which fixtures compared byte for byte reject.
      - run: git config --global core.autocrlf false
        working-directory: .

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          package-manager-cache: false

      # Corepack downloads pnpm on every run otherwise; the pin it is keyed on carries pnpm's hash.
      - id: corepack
        shell: bash
        run: |
          echo "COREPACK_HOME=$RUNNER_TEMP/corepack" >> "$GITHUB_ENV"
          echo "pin=$(node -p 'require("./package.json").packageManager')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/corepack
          key: corepack-${{ runner.os }}-${{ steps.corepack.outputs.pin }}

      - run: npm install --global --force corepack@0.36.0 && corepack enable pnpm

      - id: store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('cli/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # The suites mostly wait on the CLIs and git they spawn, so 1.5 workers a core keeps a runner busy.
      - name: Test
        shell: bash
        run: |
          [ -z "${CI_UMASK:-}" ] || umask "$CI_UMASK"
          pnpm run test --shard="$SHARD" --maxWorkers="$(node -p 'Math.ceil(require("node:os").availableParallelism() * 1.5)')"
        env:
          SHARD: ${{ matrix.shard }}
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com

  compat-node-min:
    name: CLI compatibility (Node 22.20.0, ubuntu-latest)
    needs: [changes, compat-node-min-shard]
    if: always() && needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: &gate-steps
      - name: Every shard passed
        working-directory: .
        run: test "$PASSED" = true
        env:
          PASSED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}

  compat-node-current-shard:
    name: CLI tests (Node 24, ubuntu-latest, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      CI_NODE_VERSION: "24.22.1"
      # The Ubuntu and Fedora login default, where new files are group-writable.
      CI_UMASK: "002"
    steps: *compat-steps

  compat-node-current:
    name: CLI compatibility (Node 24, ubuntu-latest)
    needs: [changes, compat-node-current-shard]
    if: always() && needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *gate-steps

  compat-node-26-shard:
    name: CLI tests (Node 26.12.1, ubuntu-latest, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    env:
      CI_NODE_VERSION: "26.12.1"
    steps: *compat-steps

  compat-node-26:
    name: CLI compatibility (Node 26.12.1, ubuntu-latest)
    needs: [changes, compat-node-26-shard]
    if: always() && needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *gate-steps

  compat-macos-shard:
    name: CLI tests (Node 24, macos-latest, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      CI_NODE_VERSION: "26.12.1"
    steps: *compat-steps

  compat-macos:
    name: CLI compatibility (Node 24, macos-latest)
    needs: [changes, compat-macos-shard]
    if: always() && needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *gate-steps

  compat-windows-shard:
    name: CLI tests (Node 24, windows-latest, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      CI_NODE_VERSION: "26.12.1"
    steps: *compat-steps

  compat-windows:
    name: CLI compatibility (Node 24, windows-latest)
    needs: [changes, compat-windows-shard]
    if: always() && needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps: *gate-steps

  # Each target is built and run on its own platform, so every binary is
  # proven to start where it ships.
  standalone-darwin-arm64:
    name: CLI standalone (aireg-darwin-arm64)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: macos-26
    timeout-minutes: 15
    env:
      CI_OS: darwin
      CI_ARCH: arm64
    steps: &standalone-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release build itself, unstamped, so CI proves what a release would ship.
      - uses: ./.github/actions/aireg-build
        with:
          version: 0.0.0
          commit: ${{ github.sha }}
          os: ${{ env.CI_OS }}
          arch: ${{ env.CI_ARCH }}

  standalone-darwin-amd64:
    name: CLI standalone (aireg-darwin-amd64)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      CI_OS: darwin
      CI_ARCH: amd64
    steps: *standalone-steps

  standalone-linux-amd64:
    name: CLI standalone (aireg-linux-amd64)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CI_OS: linux
      CI_ARCH: amd64
    steps: *standalone-steps

  standalone-linux-arm64:
    name: CLI standalone (aireg-linux-arm64)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    env:
      CI_OS: linux
      CI_ARCH: arm64
    steps: *standalone-steps

  standalone-windows-amd64:
    name: CLI standalone (aireg-windows-amd64.exe)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      CI_OS: windows
      CI_ARCH: amd64
    steps: *standalone-steps

  standalone-windows-arm64:
    name: CLI standalone (aireg-windows-arm64.exe)
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      CI_OS: windows
      CI_ARCH: arm64
    steps: *standalone-steps

  spec:
    name: Registry spec and schemas
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - run: python3 -m pip install --require-hashes -r tools/requirements.txt
      - run: python3 tools/check.py examples/acme-registry
      - run: python3 tools/check.py examples/aireg
      - run: python3 -I -m unittest discover -s tools -p test_check.py
      # Fails rather than skipping the instance tier if jsonschema is missing.
      - run: python3 tools/check_schemas.py --require-jsonschema

  docs:
    name: Documentation validation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"
      - run: python3 -m pip install --require-hashes -r docs/requirements.txt
      - run: python3 tools/build_figures.py --check
      # Fails when an install pin in the docs or the aireg skills is not cli/package.json's version.
      - run: python3 tools/check_pins.py
      - run: mkdocs build --strict

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Scans the push or pull request range (all history on a first push) with a digest-pinned image.
      # Unknown results may be live; the excluded files are tests that hold fake credentials.
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          version: 3.99.7@sha256:0d003fc3abc4e1565eca8462b992001314de51451e96e3c44de80d116794d5d1
          extra_args: --results=verified,unknown --exclude-paths=.github/secret-scan-exclude.txt
