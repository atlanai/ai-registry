# Releases the cli/package.json version of aireg to the stable channel and GitHub Releases.
# Variables (public): RELEASE_ORIGIN_PROD, RELEASE_TRUSTED_KEYS_PROD, RELEASE_MACOS_CODESIGN_IDENTIFIER,
# optional RELEASE_PREFIX. Secrets, so logs mask every AWS detail: AWS_REGION, AWS_PUBLISH_ROLE and
# AWS_SIGN_ROLE (to log in), and AWS_CONFIG_SECRET, the AWS Secrets Manager JSON secret everything else
# comes from (keys `bucket`, `signing_key_secret`, `macos_signing_secret`), masked once read.
# Approval is the release-gate environment on the jobs that log in to AWS, the only environment AWS trusts.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and stage, publish nothing
        type: boolean
        default: false
      minimum_version:
        description: Oldest aireg that may keep running (blank keeps the current floor)
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  # Empty publishes at the bucket root; a non-empty prefix must also be the origin's path.
  RELEASE_PREFIX: ${{ vars.RELEASE_PREFIX || '' }}
  RELEASE_ORIGIN: ${{ vars.RELEASE_ORIGIN_PROD }}
  RELEASE_TRUSTED_KEYS: ${{ vars.RELEASE_TRUSTED_KEYS_PROD }}
  RELEASE_MACOS_CODESIGN_IDENTIFIER: ${{ vars.RELEASE_MACOS_CODESIGN_IDENTIFIER }}

jobs:
  plan:
    name: Plan stable release
    if: github.repository == 'atlanai/ai-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      key_id: ${{ steps.plan.outputs.key_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MINIMUM: ${{ inputs.minimum_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] || fail "releases run from main"
          plain='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          version=$(jq -r .version cli/package.json)
          [[ "$version" =~ $plain ]] || fail "cli/package.json version '$version' is not MAJOR.MINOR.PATCH"
          if [ -n "$MINIMUM" ]; then
            [[ "$MINIMUM" =~ $plain ]] || fail "minimum_version '$MINIMUM' is not MAJOR.MINOR.PATCH"
            [ "$(printf '%s\n%s\n' "$version" "$MINIMUM" | sort -V | tail -1)" = "$version" ] || fail "minimum_version is newer than $version"
          fi
          if git rev-parse -q --verify "refs/tags/aireg-v$version" >/dev/null && [ "$DRY_RUN" != true ]; then
            fail "aireg-v$version already exists; bump cli/package.json in a release PR"
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          [ "$passed" -gt 0 ] || fail "CI has not passed on $GITHUB_SHA"
          for name in RELEASE_ORIGIN RELEASE_TRUSTED_KEYS RELEASE_MACOS_CODESIGN_IDENTIFIER; do
            [ -n "${!name}" ] || fail "$name is not set"
          done
          [[ "$RELEASE_MACOS_CODESIGN_IDENTIFIER" =~ ^[a-z0-9-]+(\.[a-z0-9-]+)+$ ]] || fail "RELEASE_MACOS_CODESIGN_IDENTIFIER '$RELEASE_MACOS_CODESIGN_IDENTIFIER' must be lowercase reverse-DNS, such as com.example.tool"
          [[ "$RELEASE_ORIGIN" == https://* ]] || fail "the release origin must be https"
          # Slash-separated plain segments, no leading or trailing slash; empty means the bucket root.
          [[ "$RELEASE_PREFIX" =~ ^([A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)?$ ]] || fail "RELEASE_PREFIX '$RELEASE_PREFIX' must be empty or a/b/c with no leading or trailing slash"
          key_id=$(jq -er 'if type == "object" and length == 1 then keys[0] else error("") end' <<< "$RELEASE_TRUSTED_KEYS") || fail "the trusted keyring must hold exactly one key"
          previous=$(git tag -l 'aireg-v*' --sort=-v:refname | grep -E '^aireg-v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "aireg-v$version" | head -1 || true)
          printf 'version=%s\nprevious=%s\nkey_id=%s\n' "$version" "$previous" "$key_id" >> "$GITHUB_OUTPUT"

  build:
    name: Release binary (${{ matrix.os }}-${{ matrix.arch }})
    needs: plan
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: darwin, arch: arm64, runner: macos-26}
          - {os: darwin, arch: amd64, runner: macos-26-intel}
          - {os: linux, arch: amd64, runner: ubuntu-26.04}
          - {os: linux, arch: arm64, runner: ubuntu-26.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/aireg-build
        with:
          version: ${{ needs.plan.outputs.version }}
          commit: ${{ github.sha }}
          origin: ${{ env.RELEASE_ORIGIN }}
          trusted-keys: ${{ env.RELEASE_TRUSTED_KEYS }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aireg-binary-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/dist-standalone/bin/
          if-no-files-found: error

  # Signs and notarizes the darwin binaries, with no checkout and no installed packages.
  sign-macos:
    name: Sign and notarize the macOS binaries
    needs: [plan, build]
    # Dry runs stage unsigned binaries, so they never wait for approval.
    if: ${{ !cancelled() && !inputs.dry_run && needs.build.result == 'success' }}
    environment: release-gate
    permissions:
      id-token: write
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check the signing secrets
        env:
          # A boolean, so this log shows only true/false.
          SECRETS_SET: ${{ secrets.AWS_SIGN_ROLE != '' && secrets.AWS_REGION != '' && secrets.AWS_CONFIG_SECRET != '' }}
        run: |
          if [ "$SECRETS_SET" != true ]; then
            echo "::error::set the AWS_REGION, AWS_SIGN_ROLE and AWS_CONFIG_SECRET repository secrets"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aireg-binary-darwin-*
          path: bin
          merge-multiple: true

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_SIGN_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 900
          mask-aws-account-id: true

      # A bare Mach-O can't be stapled, so Gatekeeper checks the notarization online.
      - name: Sign and notarize
        working-directory: bin
        env:
          CONFIG_SECRET: ${{ secrets.AWS_CONFIG_SECRET }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          umask 077
          secret="$RUNNER_TEMP/apple.json"
          SIGNING_SECRET=$(aws secretsmanager get-secret-value --secret-id "$CONFIG_SECRET" \
            --query SecretString --output text | jq -er '.macos_signing_secret | select(type == "string" and length > 0)')
          echo "::add-mask::$SIGNING_SECRET"
          aws secretsmanager get-secret-value --secret-id "$SIGNING_SECRET" \
            --query SecretString --output text > "$secret"
          field() { jq -er --arg k "$1" '.[$k] | select(type == "string" and length > 0)' "$secret"; }
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_KEY APPLE_API_KEY_BASE64 APPLE_API_ISSUER; do
            field "$key" > /dev/null || { echo "::error::the signing secret has no $key"; exit 1; }
          done
          identity=$(field APPLE_SIGNING_IDENTITY)

          # Throwaway keychain, deleted by the cleanup step.
          keychain="$RUNNER_TEMP/aireg-signing.keychain-db"
          password=$(openssl rand -hex 24)
          field APPLE_CERTIFICATE | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$(field APPLE_CERTIFICATE_PASSWORD)" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          searched=("$keychain")
          while IFS= read -r line; do searched+=("$(tr -d ' "' <<< "$line")"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "${searched[@]}"
          rm -f "$RUNNER_TEMP/certificate.p12"

          # JIT entitlements for the bundled JavaScript runtime.
          cat > "$RUNNER_TEMP/entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          PLIST
          for binary in aireg-darwin-arm64 aireg-darwin-amd64; do
            codesign --force --options runtime --timestamp \
              --identifier "$RELEASE_MACOS_CODESIGN_IDENTIFIER" \
              --entitlements "$RUNNER_TEMP/entitlements.plist" \
              --keychain "$keychain" --sign "$identity" "$binary"
            codesign --verify --strict --verbose=2 "$binary"
            codesign --display --verbose=2 "$binary" 2>&1 | grep -qx "Identifier=$RELEASE_MACOS_CODESIGN_IDENTIFIER"
          done
          chmod +x aireg-darwin-arm64
          test "$(HOME="$RUNNER_TEMP" AIREG_DISABLE_UPDATE_CHECK=1 ./aireg-darwin-arm64 --version)" = "$VERSION"

          field APPLE_API_KEY_BASE64 | base64 --decode > "$RUNNER_TEMP/notary.p8"
          # ditto zips only one source, so both binaries go in one folder first.
          mkdir "$RUNNER_TEMP/notarize"
          cp aireg-darwin-arm64 aireg-darwin-amd64 "$RUNNER_TEMP/notarize/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$(field APPLE_API_KEY)" --issuer "$(field APPLE_API_ISSUER)" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          status=$(jq -r .status "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            id=$(jq -r .id "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$(field APPLE_API_KEY)" --issuer "$(field APPLE_API_ISSUER)" || true
            echo "::error::notarization finished as $status"
            exit 1
          fi

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/aireg-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple.json" "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8" \
            "$RUNNER_TEMP/notary.json" "$RUNNER_TEMP/notarize.zip"
          rm -rf "$RUNNER_TEMP/notarize"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aireg-binary-darwin-arm64
          path: bin/aireg-darwin-arm64
          if-no-files-found: error
          overwrite: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aireg-binary-darwin-amd64
          path: bin/aireg-darwin-amd64
          if-no-files-found: error
          overwrite: true

  # Assembles every release file and attests it, with no cloud credentials and no installed
  # packages. Its digests output is what the later jobs check their download against.
  stage:
    name: Stage release files
    needs: [plan, build, sign-macos]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign-macos.result == 'success' || (inputs.dry_run && needs.sign-macos.result == 'skipped')) }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: cli/.node-version
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aireg-binary-*
          path: cli/dist-standalone/bin
          merge-multiple: true

      # packaging/main.ts imports only Node built-ins and this repository, so no install is needed.
      - name: Render the installer
        working-directory: cli
        env:
          AIREG_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          AIREG_RELEASE_ORIGIN: ${{ env.RELEASE_ORIGIN }}
        run: node --experimental-strip-types packaging/main.ts installer

      - name: Collect the release files
        run: |
          set -euo pipefail
          mkdir release
          cp cli/dist-standalone/bin/aireg-darwin-* cli/dist-standalone/bin/aireg-linux-* \
            cli/dist-standalone/install.sh LICENSE NOTICE cli/THIRD_PARTY_NOTICES.txt release/
          (cd release && sha256sum -- * > SHA256SUMS)

      - id: attest
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/aireg-*
            release/install.sh

      - id: digests
        working-directory: release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -n "$BUNDLE" ]; then cp "$BUNDLE" "aireg-$VERSION.sigstore.json"; fi
          { echo "digests<<END_OF_DIGESTS"; sha256sum -- *; echo END_OF_DIGESTS; } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aireg-release
          path: release/
          if-no-files-found: error

  publish:
    name: Publish stable release
    needs: [plan, stage]
    if: ${{ !cancelled() && !inputs.dry_run && needs.stage.result == 'success' }}
    # The only approval: release-gate reviewers hold this job; AWS trusts no other environment.
    environment: release-gate
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the publish secrets
        env:
          # A boolean, so this log shows only true/false.
          SECRETS_SET: ${{ secrets.AWS_PUBLISH_ROLE != '' && secrets.AWS_REGION != '' && secrets.AWS_CONFIG_SECRET != '' }}
        run: |
          if [ "$SECRETS_SET" != true ]; then
            echo "::error::set the AWS_REGION, AWS_PUBLISH_ROLE and AWS_CONFIG_SECRET repository secrets"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: cli/.node-version
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aireg-release
          path: release

      - name: Check the staged files
        env:
          DIGESTS: ${{ needs.stage.outputs.digests }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DIGESTS" > "$RUNNER_TEMP/staged.sha256"
          cd release
          sha256sum --check --strict --quiet "$RUNNER_TEMP/staged.sha256"
          [ "$(find . -type f | wc -l)" -eq "$(wc -l < "$RUNNER_TEMP/staged.sha256")" ]

      # Credentials come last: every later step runs only this repository's code and the AWS CLI.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-duration-seconds: 900
          mask-aws-account-id: true

      # Masked step outputs pass within this job only; GitHub drops masked values from job outputs.
      - id: config
        name: Read the release config
        env:
          SECRET_ID: ${{ secrets.AWS_CONFIG_SECRET }}
        run: |
          set -euo pipefail
          config="$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text)"
          for field in bucket signing_key_secret; do
            if ! value="$(jq -er --arg f "$field" '.[$f] | select(type == "string" and test("^[^\\r\\n]+$"))' <<< "$config" 2>/dev/null)"; then
              echo "::error::the release config secret must be JSON with a non-empty, single-line string '$field'"
              exit 1
            fi
            echo "::add-mask::$value"
            printf '%s=%s\n' "$field" "$value" >> "$GITHUB_OUTPUT"
          done

      - uses: ./.github/actions/aireg-publish
        with:
          dir: ${{ github.workspace }}/release
          version: ${{ needs.plan.outputs.version }}
          channel: stable
          minimum-version: ${{ inputs.minimum_version }}
          key-id: ${{ needs.plan.outputs.key_id }}
          origin: ${{ env.RELEASE_ORIGIN }}
          bucket: ${{ steps.config.outputs.bucket }}
          prefix: ${{ env.RELEASE_PREFIX }}
          signing-key-secret: ${{ steps.config.outputs.signing_key_secret }}
          trusted-keys: ${{ env.RELEASE_TRUSTED_KEYS }}

  # Last, so the tag only ever names a release whose channel is already live.
  github-release:
    name: Create the GitHub Release
    needs: [plan, stage, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aireg-release
          path: release

      - name: Check the staged files
        env:
          DIGESTS: ${{ needs.stage.outputs.digests }}
        run: |
          set -euo pipefail
          printf '%s\n' "$DIGESTS" > "$RUNNER_TEMP/staged.sha256"
          cd release
          sha256sum --check --strict --quiet "$RUNNER_TEMP/staged.sha256"
          [ "$(find . -type f | wc -l)" -eq "$(wc -l < "$RUNNER_TEMP/staged.sha256")" ]

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          set -euo pipefail
          tag="aireg-v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "aireg $VERSION" --latest --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
