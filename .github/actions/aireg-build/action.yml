name: Build aireg
description: Compiles and runs aireg for this runner's platform.

inputs:
  version:
    required: true
  commit:
    required: true
  origin:
    description: Blank builds a binary that does not update itself
    required: false
    default: ""
  trusted-keys:
    required: false
    default: ""
  os:
    required: true
  arch:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: cli/.node-version
        package-manager-cache: false

    # Exact: the binary embeds this Bun, and packaging/targets.ts refuses any other.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: cli/.bun-version

    - name: Compile
      shell: bash
      working-directory: cli
      env:
        AIREG_RELEASE_VERSION: ${{ inputs.version }}
        AIREG_RELEASE_COMMIT: ${{ inputs.commit }}
        AIREG_RELEASE_ORIGIN: ${{ inputs.origin }}
        TRUSTED_KEYS: ${{ inputs.trusted-keys }}
      run: |
        set -euo pipefail
        corepack enable pnpm
        pnpm install --frozen-lockfile
        AIREG_RELEASE_KEYRING="$(printf '%s' "$TRUSTED_KEYS" | base64 | tr -d '\n')"
        export AIREG_RELEASE_KEYRING
        pnpm run release:compile

    - name: Run
      shell: bash
      working-directory: cli/dist-standalone/bin
      env:
        BINARY: aireg-${{ inputs.os }}-${{ inputs.arch }}${{ inputs.os == 'windows' && '.exe' || '' }}
        VERSION: ${{ inputs.version }}
        AIREG_DISABLE_UPDATE_CHECK: "1"
      run: |
        set -euo pipefail
        # Bun signs Apple silicon builds itself; a bad signature runs here but is killed elsewhere.
        if [ "$BINARY" = aireg-darwin-arm64 ]; then
          codesign --verify --strict "./$BINARY"
        fi
        # Bun writes these properties only when it compiles on Windows; packaging/compile.ts sets them.
        if [[ "$BINARY" == *.exe ]]; then
          company=$(powershell -NoProfile -Command "(Get-Item -LiteralPath './$BINARY').VersionInfo.CompanyName" | tr -d '\r')
          [ -n "$company" ] || { echo "::error::$BINARY has no publisher in its properties"; exit 1; }
        fi
        test "$("./$BINARY" --version | tr -d '\r')" = "$VERSION"
        "./$BINARY" --help >/dev/null
        # `doctor` runs far more of the binary than `--version` does.
        log="$RUNNER_TEMP/doctor.log"
        if ! "./$BINARY" doctor > "$log" 2>&1 || grep -q "Cannot find native binding" "$log"; then
          echo "::error::$BINARY failed to run doctor"
          cat "$log"
          exit 1
        fi

    # What the installer hands over to, in a throwaway home: placing itself, PATH and uninstalling.
    # Outside GitHub Actions' view, so PATH goes where a person's would, not to $GITHUB_PATH.
    - name: Install and uninstall
      shell: bash
      working-directory: cli/dist-standalone/bin
      env:
        BINARY: aireg-${{ inputs.os }}-${{ inputs.arch }}${{ inputs.os == 'windows' && '.exe' || '' }}
        VERSION: ${{ inputs.version }}
        AIREG_DISABLE_UPDATE_CHECK: "1"
      run: |
        set -euo pipefail
        export HOME="$RUNNER_TEMP/home"
        mkdir -p "$HOME"
        exe=""
        [[ "$BINARY" == *.exe ]] && exe=.exe
        installed="$HOME/.aireg/bin/aireg$exe"
        on_path() {
          if [ -n "$exe" ]; then
            powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path', 'User')" \
              | tr ';' '\n' | tr -d '\r' | grep -qixF "$(cygpath -w "$HOME/.aireg/bin")"
          else
            grep -qF '.aireg/env' "$HOME/.profile"
          fi
        }
        # Staged under its own name, as the installers stage it: only `aireg` installs itself.
        stage="$RUNNER_TEMP/stage"
        mkdir -p "$stage"
        cp "$BINARY" "$stage/aireg$exe"
        env -u GITHUB_ACTIONS "$stage/aireg$exe" --setup --yes
        test "$("$installed" --version | tr -d '\r')" = "$VERSION"
        on_path || { echo "::error::--setup did not put aireg on PATH"; exit 1; }
        # The daemon is detached from the command that starts it, so it must outlive that command.
        "$installed" daemon start
        "$installed" daemon status | grep -qi "^running" || { echo "::error::the daemon did not stay up"; exit 1; }
        "$installed" daemon stop
        env -u GITHUB_ACTIONS "$installed" self uninstall --yes
        # On Windows the folder holding the running aireg.exe goes once that process exits.
        for _ in $(seq 30); do [ -e "$HOME/.aireg" ] || break; sleep 1; done
        if [ -e "$HOME/.aireg" ]; then
          echo "::error::self uninstall left $HOME/.aireg"
          find "$HOME/.aireg"
          exit 1
        fi
        if on_path; then echo "::error::self uninstall left aireg on PATH"; exit 1; fi
