<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-label="One registry holding skills and agents, read by any client for any agent, and stored on one storage: a folder or a git repository today, and later an object storage bucket or a hosted service.">
<rect width="720" height="372" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8583"/></marker></defs>
<text x="30" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#17201F" text-anchor="start">One registry, any client, any storage</text>
<text x="30" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#4A5654" text-anchor="start">A registry that follows the specification is a set of files. Who reads them and where they live are both open.</text>
