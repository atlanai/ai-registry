<rect x="566" y="280" width="110" height="24" rx="5" fill="#FFFFFF" stroke="#B9C2BF" stroke-width="1" stroke-dasharray="4 3"/>
<text x="621" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#4A5654" text-anchor="middle" dominant-baseline="central">hosted service</text>
<text x="30" y="342" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7A8583" text-anchor="start">Teal: what the specification defines. Grey: your choice on both sides. Dashed: planned, or no client reads it yet.</text>
<text x="30" y="359" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#7A8583" text-anchor="start">aireg reads a registry from a folder or a git repository.</text>
